name: AgentRouter Login (20h cycle)

# Every 20 hours = 6 logins per 5 days, still anchored on the old 18:00 UTC slot.
# 20h does not divide evenly into 24h, so one daily cron cannot express it. Instead the
# 5-day cycle is listed out: 18:00 → 14:00 → 10:00 → 06:00 → 02:00 → 22:00 → repeat.
# The day-of-month lists are (day - 1) mod 5, so the 20h spacing holds through any month.
# The phase restarts with each new calendar month, which never skips a UTC day — at worst
# it stretches one gap to 24h (31-day months) or 32-36h (February).
on:
  schedule:
    - cron: '0 18 1,6,11,16,21,26,31 * *'  # cycle day 1 of 5
    - cron: '0 14 2,7,12,17,22,27 * *'     # cycle day 2 of 5
    - cron: '0 10 3,8,13,18,23,28 * *'     # cycle day 3 of 5
    - cron: '0 6 4,9,14,19,24,29 * *'      # cycle day 4 of 5
    - cron: '0 2 5,10,15,20,25,30 * *'     # cycle day 5 of 5
    - cron: '0 22 5,10,15,20,25,30 * *'    # 20h after the 02:00 slot, same day
  workflow_dispatch:  # Manual trigger for testing

jobs:
  daily-login:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        account: [1, 2]
      fail-fast: false  # Don't stop account 2 if account 1 fails

    steps:
      - name: "🔑 Login Account ${{ matrix.account }}"
        env:
          # Account 1
          AR_USERNAME_1: ${{ secrets.AR_USERNAME }}
          AR_PASSWORD_1: ${{ secrets.AR_PASSWORD }}
          # Account 2
          AR_USERNAME_2: ${{ secrets.AR_USERNAME_2 }}
          AR_PASSWORD_2: ${{ secrets.AR_PASSWORD_2 }}
          # Shared
          WORKER_URL: ${{ secrets.AR_WORKER_URL }}
          PROXY_SECRET: ${{ secrets.AR_PROXY_SECRET }}
          ACCOUNT: ${{ matrix.account }}
          TZ: Asia/Kolkata  # Set timezone to IST for all date commands
        run: |
          echo "🔑 AgentRouter Daily Login — Account $ACCOUNT"
          echo "   IST: $(date '+%Y-%m-%d %I:%M:%S %p IST')"
          echo "   UTC: $(TZ=UTC date '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""

          # Select credentials based on account number
          if [ "$ACCOUNT" = "1" ]; then
            USERNAME="$AR_USERNAME_1"
            PASSWORD="$AR_PASSWORD_1"
          else
            USERNAME="$AR_USERNAME_2"
            PASSWORD="$AR_PASSWORD_2"
          fi

          if [ -z "$USERNAME" ] || [ -z "$PASSWORD" ]; then
            echo "❌ Credentials for Account $ACCOUNT are not set!"
            echo "   Add AR_USERNAME_2 and AR_PASSWORD_2 to GitHub Secrets"
            exit 1
          fi

          if [ -z "$WORKER_URL" ] || [ -z "$PROXY_SECRET" ]; then
            echo "❌ AR_WORKER_URL or AR_PROXY_SECRET secret is not set!"
            exit 1
          fi

          # Random delay 10-60s (different per account to avoid simultaneous hits)
          DELAY=$(( (RANDOM % 50 + 10) + (ACCOUNT * 15) ))
          echo "⏳ Waiting ${DELAY}s (random delay)..."
          sleep $DELAY

          # Call Cloudflare Worker (bypasses AgentRouter WAF)
          echo "🌐 Calling login via Cloudflare Worker..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "$WORKER_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $PROXY_SECRET" \
            -d "{\"username\":\"${USERNAME}\",\"password\":\"${PASSWORD}\"}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "   HTTP Status: $HTTP_CODE"
          echo "   Response: $BODY"

          # Check for WAF block
          if echo "$BODY" | grep -q "WAF_BLOCKED"; then
            echo ""
            echo "❌ WAF blocked even Cloudflare Worker IP!"
            exit 1
          fi

          # Check for success
          if echo "$BODY" | grep -q '"success":true'; then
            echo ""
            echo "✅ ✅ ✅  ACCOUNT $ACCOUNT — LOGIN SUCCESSFUL!"
            echo "   Fresh session → credits applied!"
          elif [ "$HTTP_CODE" = "200" ]; then
            echo ""
            echo "✅ Account $ACCOUNT — Got 200 OK — login likely successful"
          else
            echo ""
            echo "❌ Account $ACCOUNT — Login failed with status $HTTP_CODE"
            exit 1
          fi

          echo ""
          echo "🎉 Account $ACCOUNT done — $(date '+%Y-%m-%d %I:%M:%S %p IST')"
